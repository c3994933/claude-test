<script>
const W = 1080, H = (window.CFG && window.CFG.H) || 1920, CX = 540, CY = 900, R0 = 330, FPS = 30;
const CFG = window.CFG || { P: 0.66637, B0: 2.5522, T0: 2.0 };
const P = CFG.P, B0 = CFG.B0, T0 = CFG.T0;
const N0 = -12, KMAX = 35;                 // beats 0..35 -> 10^-12 .. 10^23
const beatT = k => B0 + k * P;
const DROP = beatT(12), CUT = beatT(36);   // music is cut at beat 36
const CODA_Z = 2.4, HOLD_U = 1.3, CARD = CUT + CODA_Z + HOLD_U, END = CUT + 4.8;
const c = document.getElementById('c'), ctx = c.getContext('2d');

// ------------------------------------------------------------ utils
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const TAU = Math.PI * 2;

function radial(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }

function glow(x, y, R, col, a) {

function blob(cx, cy, rx, ry, seed, n = 10, jit = 0.25, rot = 0) {

const CONTS = (() => { const R = rng(7), a = []; for (let i = 0; i < 9; i++) a.push([R() * TAU, (R() - 0.5) * 1.8, 0.25 + R() * 0.35, i + 40]); return a; })();
const CLOUDS = (() => { const R = rng(8), a = []; for (let i = 0; i < 14; i++) a.push([R() * TAU, (R() - 0.5) * 2.2, 0.12 + R() * 0.2, i + 90]); return a; })();
const WEB = (() => { const R = rng(26), nodes = []; for (let i = 0; i < 120; i++) { const a = R() * TAU, d = Math.sqrt(R()) * 0.88; nodes.push([Math.cos(a) * d, Math.sin(a) * d, R()]); }

const VIRGO = (() => { const R = rng(24), a = []; for (let i = 0; i < 520; i++) a.push([gauss(R) * 0.16, gauss(R) * 0.14, R()]); return a; })();

const ARM = (() => { const R = rng(20), a = []; for (let i = 0; i < 3200; i++) { const x = (R() * 2 - 1) * 1.6, w = gauss(R) * 0.22; a.push([x, x * 0.45 + w, R(), R()]); } return a; })();

const ZONES = [[-12, -4.5, '微观', [80, 230, 220]], [-4.5, 4.5, '人类尺度', [255, 196, 110]], [4.5, 8.5, '地球', [110, 180, 255]],

// ------------------------------------------------------------ timeline
function Z(t) {

// ------------------------------------------------------------ objects (ctx is translated to the view centre)
const O = {};
